# Step 1 — GitHub Actions trigger.
# PR events (opened / new commit / reopened) run the review; manual dispatch
# is the no-commit test button. Secrets and env wiring are commented out
# until later steps need them.
name: pr-review

on:
  # Real review: PR created / new commit pushed to the PR branch / reopened.
  # Pushes to branches WITHOUT an open PR trigger nothing (by design).
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual testing: "Run workflow" button / `gh workflow run` — no PR context,
  # falls back to --pr 0 --event push.
  workflow_dispatch:

# One in-flight run per PR (per ref for manual runs); newer cancels older.
concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# TODO later steps: read-only repo access for GitHub client (Step 2)
# permissions:
#   contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    # TODO later steps: wire secrets + env
    # env:
    #   PR_NUMBER: ${{ github.event.pull_request.number }}
    #   PR_EVENT: ${{ github.event.action }}
    #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   AI_API_KEY: ${{ secrets.AI_API_KEY }}
    #   MODEL_NAME: gpt-4o
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run PR reviewer
        # PR events → github.event.* are set (real review).
        # Manual dispatch → both are empty → fallbacks give --pr 0 --event push.
        run: |
          uv run python orchestrator/main.py \
            --pr "${{ github.event.pull_request.number || 0 }}" \
            --event "${{ github.event.action || 'push' }}"
