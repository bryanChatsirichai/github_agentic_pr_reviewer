# Step 1 — GitHub Actions trigger.
# PR events (opened / new commit / reopened) run the review; manual dispatch
# is the no-commit test button. Secrets and env wiring are commented out
# until later steps need them.
name: pr-review

on:
  # Real review: PR created / new commit pushed to the PR branch / reopened.
  # Pushes to branches WITHOUT an open PR trigger nothing (by design).
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual testing: "Run workflow" button / `gh workflow run` — no PR context,
  # falls back to --pr 0 --event push.
  workflow_dispatch:

# One in-flight run per PR (per ref for manual runs); newer cancels older.
concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# TODO later steps: tighten to read-only (contents: read) once posting lands
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      # `secrets.GITHUB_TOKEN` is provisioned automatically by Actions.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Step 4: LLM access — MODEL_PROVIDER (google | openai | claude) as a
      # repo *variable* is the one value to flip when switching providers;
      # the matching key secret is then picked automatically. Required —
      # if the variable is missing, the run logs an error and exits 1
      # (see docs/llm-providers.md).
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER }}
      # Optional model overrides — repo *variables* (model names are not
      # secret). Unset → empty → the provider's default model is used.
      GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run PR reviewer
        # PR events → github.event.* are set (real review).
        # Manual dispatch → both are empty → fallbacks give --pr 0 --event push.
        run: |
          uv run python -m orchestrator.main \
            --pr "${{ github.event.pull_request.number || 0 }}" \
            --event "${{ github.event.action || 'push' }}"
