[project]
name = "github-agentic-pr-reviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-core>=1.7.0",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "pydantic>=2.14.1",
    "pygithub>=2.10.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
# No __init__.py anywhere — packages are PEP 420 namespace packages. pytest's
# rootdir-relative import then can't see them, so put the repo root on sys.path.
pythonpath = ["."]
